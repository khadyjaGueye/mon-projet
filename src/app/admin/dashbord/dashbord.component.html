<div class="wrapper">

  <!-- Sidebar -->
  <aside class="sidebar" [class.active]="sidebarOpen">
    <div class="logo">
      <h3>Ongelerie</h3>
    </div>
    <ul class="nav flex-column mt-4">
      <li class="nav-item">
        <a (click)="displayService()" class="nav-link" [class.active]="display==='service'">
          <i class="bi bi-speedometer2"></i> Service
        </a>
      </li>
      <li class="nav-item">
        <a (click)="displayVideo()" class="nav-link" [class.active]="display==='video'">
          <i class="bi bi-person-badge"></i> Video
        </a>
      </li>
      <li class="nav-item">
        <a (click)="displayHoraire()" class="nav-link" [class.active]="display==='horaire'">
          <i class="bi bi-diagram-3"></i> Horaire
        </a>
      </li>
    </ul>

  </aside>

  <!-- Main -->
  <div class="main">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container-fluid d-flex justify-content-between align-items-center">

        <!-- Bouton hamburger visible uniquement sur mobile -->
        <button class="btn btn-light d-lg-none" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>

        <h4 class="mb-0">Administration Onglerie</h4>

        <div class="d-flex align-items-center gap-4">
          <i class="bi bi-bell fs-5"></i>
          <i class="bi bi-gear fs-5"></i>

          <div class="dropdown">
            <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
              Admin
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item">Profil</a></li>
              <li><a class="dropdown-item text-danger">Déconnexion</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- Contenu -->
    <div class="container-fluid p-4">
      <div [ngSwitch]="display">
        <app-service *ngSwitchCase="'service'"></app-service>
        <app-video *ngSwitchCase="'video'"></app-video>
        <app-horaire *ngSwitchCase="'horaire'"></app-horaire>
      </div>
    </div>
  </div>
</div>
