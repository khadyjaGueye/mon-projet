<section id="contact" class="py-5 bg-light-custom">

  <div class="container text-center">

      <h2 class="display-6 fw-bold text-color mb-4">
          Contact & Réservation
      </h2>

      <p class="lead text-muted mb-4">
          Pour réserver un service ou obtenir plus d'informations,
          contactez-nous directement via WhatsApp.
      </p>

      <button class="btn btn-color btn-lg px-4"
              (click)="sendWhatsApp()">
          <i class="bi bi-whatsapp me-2"></i>
          Réserver via WhatsApp
      </button>

  </div>

</section>
