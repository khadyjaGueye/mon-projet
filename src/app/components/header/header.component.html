<nav class="navbar navbar-expand-lg bg-white fixed-top">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand" routerLink="/">
      <img src="/assets/images/logo.png" alt="Logo" height="50">
    </a>

    <!-- Bouton Menu Mobile -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarMenu"
      aria-controls="navbarMenu"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <i class="bi bi-list fs-2"></i>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">

      <ul class="navbar-nav align-items-lg-center">

        <li class="nav-item">
          <a class="nav-link fw-semibold text-color" href="#services">
            Services
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold text-color" href="#horaires">
            Horaires
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold text-color" href="#contact">
            Contact
          </a>
        </li>

        <!-- Utilisateur non connecté -->
        <ng-container *ngIf="!isLoggedIn; else loggedInBlock">

          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <a routerLink="/login" class="btn btn-color px-4">
              Connexion
            </a>
          </li>

          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <a routerLink="/register" class="btn btn-color px-4">
              Inscription
            </a>
          </li>

        </ng-container>

        <!-- Utilisateur connecté -->
        <ng-template #loggedInBlock>

          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <a routerLink="/profil" class="btn btn-outline-secondary px-3">
              <i class="bi bi-person-circle"></i>
              Profil
            </a>
          </li>

          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <button
              class="btn btn-custom px-4"
              (click)="logout()">
              Déconnexion
            </button>
          </li>

        </ng-template>

      </ul>
    </div>

  </div>
</nav>
