<header>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
        <img src="assets/images/logo1.png" alt="Logo" height="45">
        <span class="ms-2 text-color">Momo Onglerie</span>
      </a>

      <!-- Menu Desktop -->
      <div class="collapse navbar-collapse justify-content-end d-none d-lg-flex">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link fw-semibold text-color" href="#services">Services</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold text-color" href="#horaires">Horaires</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold text-color" href="#contact">Contact</a></li>

          <!-- ✅ Condition -->
          <ng-container *ngIf="!isLoggedIn; else loggedInBlock">
            <li class="nav-item ms-3">
              <a routerLink="/login" class="btn btn-color px-4">Connexion</a>
            </li>
            <li class="nav-item ms-3">
              <a routerLink="/register" class="btn btn-color px-4">Inscription</a>
            </li>
          </ng-container>

          <ng-template #loggedInBlock>
            <li class="nav-item ms-3">
              <!-- Icône profil -->
              <a routerLink="/profil" class="btn btn-outline-secondary px-3">
                <i class="bi bi-person-circle"></i> Profil
              </a>
            </li>
            <li class="nav-item ms-3">
              <!-- Bouton déconnexion -->
              <button class="btn btn-custom px-4" (click)="logout()">Déconnexion</button>
            </li>
          </ng-template>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero d-flex align-items-center justify-content-center text-center">

    <div class="container">

      <h1 class="display-4 fw-bold text-white">
        Relaxation &amp; Bien-être
      </h1>

      <p class="lead text-white mt-3">
        Découvrez nos soins professionnels pour un moment de détente unique.
      </p>

      <a href="#services" class="btn btn-light btn-lg mt-3">
        Découvrir les services
      </a>

    </div>

  </section>

</header>
