<header>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
        <img src="assets/images/logo1.png" alt="Logo" height="45">
        <span class="ms-2 text-color">Momo Onglerie</span>
      </a>
      <!-- Bouton Mobile -->
      <button class="navbar-toggler border-0" type="button" (click)="toggleMenu()">
        <i class="bi bi-list fs-2 text-color"></i>
      </button>
      <!-- Menu Desktop -->
      <div class="collapse navbar-collapse justify-content-end d-none d-lg-flex">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item">
            <a class="nav-link fw-semibold text-color" href="#services">
              Services
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold text-color" href="#horaires">
              Horaires
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold text-color" href="#contact">
              Contact
            </a>
          </li>

          <li class="nav-item ms-3">
            <a routerLink="/login" class="btn btn-color px-4">
              Connexion
            </a>
          </li>

        </ul>

      </div>

    </div>

    <!-- Menu Mobile -->
    <div *ngIf="isMenuOpen" class="bg-white shadow d-lg-none">

      <ul class="list-unstyled text-center py-3 mb-0">

        <li class="py-2">
          <a href="#services" class="text-decoration-none fw-semibold text-color" (click)="toggleMenu()">
            Services
          </a>
        </li>

        <li class="py-2">
          <a href="#horaires" class="text-decoration-none fw-semibold text-color" (click)="toggleMenu()">
            Horaires
          </a>
        </li>

        <li class="py-2">
          <a href="#contact" class="text-decoration-none fw-semibold text-color" (click)="toggleMenu()">
            Contact
          </a>
        </li>

        <li class="mt-3">
          <a routerLink="/login" class="btn btn-color px-4" (click)="toggleMenu()">
            Connexion
          </a>
        </li>

      </ul>

    </div>

  </nav>

  <!-- Hero -->
  <section class="hero d-flex align-items-center justify-content-center text-center">

    <div class="container">

      <h1 class="display-4 fw-bold text-white">
        Relaxation &amp; Bien-être
      </h1>

      <p class="lead text-white mt-3">
        Découvrez nos soins professionnels pour un moment de détente unique.
      </p>

      <a href="#services" class="btn btn-light btn-lg mt-3">
        Découvrir les services
      </a>

    </div>

  </section>

</header>
