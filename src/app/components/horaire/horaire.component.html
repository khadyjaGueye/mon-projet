<section id="horaires" class="py-5 bg-light-custom">

  <div class="container">

      <!-- Titre -->
      <div class="text-center mb-5">
          <h2 class="display-6 fw-bold text-color">
              Horaires d'ouverture
          </h2>
          <p class="text-muted">
              Nous vous accueillons tout au long de la semaine pour prendre soin de vous.
          </p>
      </div>

      <!-- Liste des horaires -->
      <div class="row g-4">

          <div class="col-lg-4 col-md-6"
               *ngFor="let horaire of horaires">

              <div class="card h-100 border-0 shadow-sm horaire-card">

                  <div class="card-body text-center">

                      <div class="icon-circle mb-3">
                          <i class="bi bi-clock-history fs-3"></i>
                      </div>

                      <h4 class="fw-bold text-color">
                          {{ horaire.day }}
                      </h4>

                      <hr>

                      <p class="mb-2">
                          <strong>Ouverture :</strong><br>
                          {{ horaire.open }}
                      </p>

                      <p class="mb-0">
                          <strong>Fermeture :</strong><br>
                          {{ horaire.close }}
                      </p>

                  </div>

              </div>

          </div>

      </div>

  </div>

</section>
