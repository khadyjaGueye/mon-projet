<section id="services" class="py-5 bg-light-custom">
    <div class="container">
        <!-- Titre -->
        <div class="text-center mb-5">
            <h2 class="display-6 fw-bold text-color"> Nos Services </h2>
            <p class="text-muted">
                Découvrez nos prestations pour prendre soin de vous.
            </p>
        </div>
        <!-- Liste des services -->
        <div class="row g-4">
            <div class="col-lg-4 col-md-6" *ngFor="let service of services">
                <div class="card service-card border-0 shadow-sm h-100">
                    <!-- Image -->
                    <img [src]="service.image" [alt]="service.name" class="card-img-top service-image">
                    <!-- Contenu -->
                    <div class="card-body d-flex flex-column">
                        <h4 class="card-title fw-bold text-color"> {{ service.name }} </h4>
                        <p class="card-text text-muted flex-grow-1"> {{ service.description }}</p>
                        <h5 class="fw-bold price mb-3"> {{ service.price | number }} FCFA</h5>
                        <button class="btn btn-color w-100" (click)="sendWhatsApp(service.name)">
                            <i class="bi bi-whatsapp me-2"></i>
                            Réserver via WhatsApp
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
